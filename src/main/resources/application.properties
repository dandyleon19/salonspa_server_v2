spring.application.name=SalonSpa

# R2DBC — reactive runtime (override with DB_URL, DB_USERNAME, DB_PASSWORD)
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/salonspa_webflux}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:root}

# JDBC — Flyway migrations only (override with JDBC_URL)
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/salonspa_webflux}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Spring SQL init; schema is managed by Flyway
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# JWT — override with JWT_SECRET, JWT_EXPIRATION_MS
app.jwt.secret=${JWT_SECRET:my-super-secret-key-my-super-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins in CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging.level.org.springframework.r2dbc=${R2DBC_LOG_LEVEL:INFO}
